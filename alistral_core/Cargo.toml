[package]
name = "alistral_core"
version = "0.6.10"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
musicbrainz-db-lite = { path = "../musicbrainz_db_lite" }

itertools = "0.15.0"
serde = "1.0.229"
owo-colors = "4.2.1"
chrono = "0.4.45"

# Async 
async-once-cell = "0.5.4"
futures = "0.3.34"
streamies = "0.3.0"

# Databasing
sequelles = { git = "https://github.com/RustyNova016/sequelles", rev = "04918eda92d0602852cc50bb761da990159b6ff4", features = ["chrono"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "macros"] }

# Macros
bon = "3.8.1"
thiserror = "2.0.18"
snafu = { version = "0.9.0", features = ["rust_1_81"] }

# Tracing
tracing-indicatif = "0.3.14"
tracing = "0.1.43"
tuillez = {git = "https://github.com/RustyNova016/tuillez", rev = "debb79bf8c8656a4eedb571177a8ffa3b9984e78"}

# Other 
rust_decimal = "1.36.0"
rust_decimal_macros = "1.36.0"

[lints.clippy]
result_large_err = { level = "allow", priority = 1 }
